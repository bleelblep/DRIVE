<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOPHIE ARCHIVE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #000000;
            --white: #FFFFFF;
            --cyan: #00F0FF;
            --red: #FF0000;
            --gray-bg: #F5F5F5;
            --gray-light: #E0E0E0;
            --gray-dark: #333333;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--gray-bg);
            color: var(--black);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* HEADER */
        .header {
            background: var(--black);
            color: var(--white);
            padding: 2rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .logo {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            text-transform: lowercase;
            margin-bottom: 0.5rem;
            animation: liquidWave 4s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes liquidWave {
            0%, 100% { transform: skewX(0deg) scaleY(1); }
            25% { transform: skewX(-2deg) scaleY(0.98); }
            50% { transform: skewX(0deg) scaleY(1.02); }
            75% { transform: skewX(2deg) scaleY(0.98); }
        }

        .subtitle {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0.7;
        }

        /* BREADCRUMB */
        .breadcrumb {
            background: var(--white);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--gray-light);
        }

        .breadcrumb-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .breadcrumb-link {
            color: var(--black);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .breadcrumb-link:hover {
            color: var(--cyan);
        }

        .breadcrumb-separator {
            color: var(--gray-dark);
            opacity: 0.5;
        }

        /* CONTROLS */
        .controls {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .search-bar {
            width: 100%;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            border: 2px solid var(--black);
            background: var(--white);
            margin-bottom: 1.5rem;
            transition: all 0.3s;
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 0 4px rgba(0, 240, 255, 0.1);
        }

        .filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.75rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 2px solid var(--black);
            background: var(--white);
            color: var(--black);
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .filter-btn:hover {
            background: var(--cyan);
            border-color: var(--cyan);
            color: var(--black);
        }

        .filter-btn.active {
            background: var(--black);
            color: var(--white);
        }

        .view-toggle {
            display: flex;
            gap: 0.5rem;
        }

        .view-btn {
            width: 44px;
            height: 44px;
            border: 2px solid var(--black);
            background: var(--white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .view-btn:hover {
            background: var(--cyan);
            border-color: var(--cyan);
        }

        .view-btn.active {
            background: var(--black);
        }

        .view-btn.active svg {
            stroke: var(--white);
        }

        /* RESULTS INFO */
        .results-info {
            max-width: 1400px;
            margin: 1rem auto;
            padding: 0 2rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        /* FILES GRID */
        .files-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .files-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* FILE CARD */
        .file-card {
            background: var(--white);
            border: 2px solid var(--black);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .file-card:hover {
            border-color: var(--cyan);
            box-shadow: 0 8px 30px rgba(0, 240, 255, 0.2);
            transform: translateY(-4px);
        }

        .file-card.folder:hover {
            border-color: var(--red);
            box-shadow: 0 8px 30px rgba(255, 0, 0, 0.2);
        }

        .file-thumbnail {
            width: 100%;
            aspect-ratio: 1;
            background: var(--gray-light);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .file-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .file-icon {
            width: 60px;
            height: 60px;
        }

        .file-info {
            padding: 1.5rem;
        }

        .file-name {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.5rem;
            word-break: break-word;
        }

        .file-meta {
            font-size: 0.85rem;
            color: var(--gray-dark);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .file-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .action-btn {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid var(--black);
            background: var(--white);
            color: var(--black);
            text-decoration: none;
            text-align: center;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .action-btn:hover {
            background: var(--cyan);
            border-color: var(--cyan);
        }

        .action-btn.download:hover {
            background: var(--black);
            color: var(--white);
        }

        /* LIST VIEW */
        .file-list-item {
            background: var(--white);
            border: 2px solid var(--black);
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            transition: all 0.3s;
            cursor: pointer;
        }

        .file-list-item:hover {
            border-color: var(--cyan);
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.2);
        }

        .file-list-item.folder:hover {
            border-color: var(--red);
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.2);
        }

        .file-list-thumbnail {
            width: 80px;
            height: 80px;
            background: var(--gray-light);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .file-list-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .file-list-info {
            flex: 1;
            min-width: 0;
        }

        .file-list-actions {
            display: flex;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border: 2px solid var(--black);
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: var(--cyan);
            border-color: var(--cyan);
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            max-width: 1200px;
            width: 100%;
            max-height: 90vh;
            overflow: auto;
            border: 4px solid var(--cyan);
            position: relative;
        }

        .modal-header {
            background: var(--black);
            color: var(--white);
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .modal-title {
            font-weight: 700;
            font-size: 1.2rem;
        }

        .modal-close {
            width: 40px;
            height: 40px;
            border: 2px solid var(--white);
            background: transparent;
            color: var(--white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 1.5rem;
            line-height: 1;
        }

        .modal-close:hover {
            background: var(--cyan);
            border-color: var(--cyan);
            color: var(--black);
        }

        .modal-body {
            padding: 2rem;
        }

        .media-player {
            width: 100%;
            background: var(--black);
        }

        video, audio {
            width: 100%;
            outline: none;
        }

        .image-viewer {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--black);
            padding: 2rem;
        }

        .image-viewer img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
        }

        /* LOADING */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            gap: 1rem;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--gray-light);
            border-top: 4px solid var(--cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .empty-state h2 {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 1rem;
        }

        /* PAGINATION */
        .pagination {
            max-width: 1400px;
            margin: 3rem auto;
            padding: 0 2rem;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .page-btn {
            min-width: 44px;
            height: 44px;
            padding: 0 1rem;
            border: 2px solid var(--black);
            background: var(--white);
            color: var(--black);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .page-btn:hover:not(:disabled) {
            background: var(--cyan);
            border-color: var(--cyan);
        }

        .page-btn.active {
            background: var(--black);
            color: var(--white);
        }

        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .logo {
                font-size: 2rem;
            }

            .filters {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-buttons, .view-toggle {
                width: 100%;
            }

            .filter-btn {
                flex: 1;
            }

            .files-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1rem;
            }

            .file-list-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .file-list-actions {
                width: 100%;
                justify-content: stretch;
            }

            .icon-btn {
                flex: 1;
            }

            .modal-content {
                max-height: 95vh;
            }
        }

        @media (max-width: 480px) {
            .header-content, .controls, .results-info, .files-container, .pagination {
                padding: 0 1rem;
            }

            .files-grid {
                grid-template-columns: 1fr;
            }

            .filter-buttons {
                flex-direction: column;
            }

            .filter-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header-content">
            <h1 class="logo">sophie</h1>
            <p class="subtitle">Archive</p>
        </div>
    </header>

    <!-- BREADCRUMB -->
    <nav class="breadcrumb" id="breadcrumb">
        <div class="breadcrumb-item">
            <a href="#" class="breadcrumb-link" onclick="navigateToRoot(); return false;">Home</a>
        </div>
    </nav>

    <!-- CONTROLS -->
    <div class="controls">
        <input 
            type="text" 
            class="search-bar" 
            id="searchInput" 
            placeholder="Search files..."
        />
        
        <div class="filters">
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterByType('all')" data-type="all">All</button>
                <button class="filter-btn" onclick="filterByType('folder')" data-type="folder">Folders</button>
                <button class="filter-btn" onclick="filterByType('image')" data-type="image">Images</button>
                <button class="filter-btn" onclick="filterByType('video')" data-type="video">Videos</button>
                <button class="filter-btn" onclick="filterByType('audio')" data-type="audio">Audio</button>
                <button class="filter-btn" onclick="filterByType('document')" data-type="document">Docs</button>
            </div>
            
            <div class="view-toggle">
                <button class="view-btn active" id="gridBtn" onclick="setViewMode('grid')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                </button>
                <button class="view-btn" id="listBtn" onclick="setViewMode('list')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- RESULTS INFO -->
    <div class="results-info" id="resultsInfo">Loading...</div>

    <!-- FILES CONTAINER -->
    <div class="files-container">
        <div id="filesContent" class="files-grid"></div>
    </div>

    <!-- LOADING STATE -->
    <div class="loading" id="loadingState">
        <div class="spinner"></div>
        <p class="loading-text">Loading...</p>
    </div>

    <!-- EMPTY STATE -->
    <div class="empty-state" id="emptyState" style="display: none;">
        <h2>No files found</h2>
        <p>Try adjusting your search or filters</p>
    </div>

    <!-- PAGINATION -->
    <div class="pagination" id="pagination"></div>

    <!-- MODAL -->
    <div class="modal" id="mediaModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">File Viewer</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- Google Drive API -->
    <script src="https://apis.google.com/js/api.js"></script>
    <script>
        // ========== CONFIGURATION ==========
        const CONFIG = {
            apiKey: 'AIzaSyA8lfUHsneUaeCaZnqA97nfxuE1KmdDbFY',
            rootFolderId: '1QTJTb0pBfDEZtEXOx8xKrxQmryMiYUPZ',
            pageSize: 24
        };

        // ========== STATE ==========
        let allFiles = [];
        let filteredFiles = [];
        let currentPage = 1;
        let currentViewMode = 'grid';
        let currentFilter = 'all';
        let currentFolderId = CONFIG.rootFolderId;
        let folderHistory = [{ id: CONFIG.rootFolderId, name: 'Home' }];

        // ========== INITIALIZATION ==========
        function init() {
            gapi.load('client', initClient);
            document.getElementById('searchInput').addEventListener('input', debounce(handleSearch, 300));
        }

        function initClient() {
            gapi.client.init({
                apiKey: CONFIG.apiKey,
                discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
            }).then(() => {
                loadFiles(currentFolderId);
            }).catch((error) => {
                console.error('Error initializing Google API:', error);
                showError('Failed to initialize. Please refresh the page.');
            });
        }

        // ========== FILE LOADING ==========
        async function loadFiles(folderId) {
            showLoading(true);
            try {
                const response = await gapi.client.drive.files.list({
                    q: `'${folderId}' in parents and trashed = false`,
                    fields: 'files(id, name, mimeType, size, thumbnailLink, webViewLink, webContentLink, modifiedTime)',
                    pageSize: 1000,
                    orderBy: 'folder,name'
                });

                allFiles = response.result.files.map(file => ({
                    id: file.id,
                    name: file.name,
                    type: getFileType(file.mimeType),
                    mimeType: file.mimeType,
                    size: file.size,
                    thumbnailLink: file.thumbnailLink,
                    webViewLink: file.webViewLink,
                    webContentLink: file.webContentLink,
                    modifiedTime: file.modifiedTime
                }));

                applyFilters();
                showLoading(false);
            } catch (error) {
                console.error('Error loading files:', error);
                showError('Failed to load files. Please try again.');
                showLoading(false);
            }
        }

        function getFileType(mimeType) {
            if (mimeType === 'application/vnd.google-apps.folder') return 'folder';
            if (mimeType.startsWith('image/')) return 'image';
            if (mimeType.startsWith('video/')) return 'video';
            if (mimeType.startsWith('audio/')) return 'audio';
            if (mimeType.includes('pdf') || mimeType.includes('document') || 
                mimeType.includes('spreadsheet') || mimeType.includes('presentation')) return 'document';
            return 'file';
        }

        // ========== FILTERING & SEARCH ==========
        function applyFilters() {
            let filtered = [...allFiles];

            // Apply type filter
            if (currentFilter !== 'all') {
                filtered = filtered.filter(file => file.type === currentFilter);
            }

            // Apply search
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            if (searchTerm) {
                filtered = filtered.filter(file => 
                    file.name.toLowerCase().includes(searchTerm)
                );
            }

            filteredFiles = filtered;
            currentPage = 1;
            renderFiles();
            updateResultsInfo();
        }

        function filterByType(type) {
            currentFilter = type;
            
            // Update button states
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.type === type) {
                    btn.classList.add('active');
                }
            });

            applyFilters();
        }

        function handleSearch() {
            applyFilters();
        }

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // ========== RENDERING ==========
        function renderFiles() {
            const container = document.getElementById('filesContent');
            const start = (currentPage - 1) * CONFIG.pageSize;
            const end = start + CONFIG.pageSize;
            const pageFiles = filteredFiles.slice(start, end);

            if (pageFiles.length === 0) {
                container.innerHTML = '';
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            document.getElementById('emptyState').style.display = 'none';

            if (currentViewMode === 'grid') {
                container.className = 'files-grid';
                container.innerHTML = pageFiles.map(file => renderGridCard(file)).join('');
            } else {
                container.className = 'files-list';
                container.innerHTML = pageFiles.map(file => renderListItem(file)).join('');
            }

            renderPagination();
        }

        function renderGridCard(file) {
            const isFolder = file.type === 'folder';
            const icon = getFileIcon(file.type);
            
            if (isFolder) {
                return `
                    <div class="file-card folder" onclick="openFolder('${file.id}', '${escapeHtml(file.name)}')">
                        <div class="file-thumbnail">
                            ${icon}
                        </div>
                        <div class="file-info">
                            <div class="file-name">${escapeHtml(file.name)}</div>
                            <div class="file-meta">Folder</div>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="file-card">
                    <div class="file-thumbnail" onclick="viewFile('${file.id}', '${escapeHtml(file.name)}', '${file.type}', '${file.mimeType}')">
                        ${file.thumbnailLink 
                            ? `<img src="${file.thumbnailLink}" alt="${escapeHtml(file.name)}" loading="lazy">`
                            : icon
                        }
                    </div>
                    <div class="file-info">
                        <div class="file-name">${escapeHtml(file.name)}</div>
                        <div class="file-meta">${formatFileSize(file.size)} • ${file.type}</div>
                        <div class="file-actions">
                            <button class="action-btn" onclick="viewFile('${file.id}', '${escapeHtml(file.name)}', '${file.type}', '${file.mimeType}')">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                View
                            </button>
                            ${file.webContentLink ? `
                                <a href="${file.webContentLink}" download class="action-btn download">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                        <polyline points="7 10 12 15 17 10"></polyline>
                                        <line x1="12" y1="15" x2="12" y2="3"></line>
                                    </svg>
                                    Download
                                </a>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderListItem(file) {
            const isFolder = file.type === 'folder';
            const icon = getFileIcon(file.type);

            if (isFolder) {
                return `
                    <div class="file-list-item folder" onclick="openFolder('${file.id}', '${escapeHtml(file.name)}')">
                        <div class="file-list-thumbnail">${icon}</div>
                        <div class="file-list-info">
                            <div class="file-name">${escapeHtml(file.name)}</div>
                            <div class="file-meta">Folder</div>
                        </div>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </div>
                `;
            }

            return `
                <div class="file-list-item">
                    <div class="file-list-thumbnail">
                        ${file.thumbnailLink 
                            ? `<img src="${file.thumbnailLink}" alt="${escapeHtml(file.name)}" loading="lazy">`
                            : icon
                        }
                    </div>
                    <div class="file-list-info">
                        <div class="file-name">${escapeHtml(file.name)}</div>
                        <div class="file-meta">${formatFileSize(file.size)} • ${file.type}</div>
                    </div>
                    <div class="file-list-actions">
                        <button class="icon-btn" onclick="viewFile('${file.id}', '${escapeHtml(file.name)}', '${file.type}', '${file.mimeType}')" title="View">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                        ${file.webContentLink ? `
                            <a href="${file.webContentLink}" download class="icon-btn" title="Download">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                            </a>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // ========== FILE ICONS ==========
        function getFileIcon(type) {
            const icons = {
                folder: `<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>`,
                image: `<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>`,
                video: `<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2">
                    <polygon points="23 7 16 12 23 17 23 7"></polygon>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                </svg>`,
                audio: `<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2">
                    <path d="M9 18V5l12-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="18" cy="16" r="3"></circle>
                </svg>`,
                document: `<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="var(--black)" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>`,
                file: `<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="var(--gray-dark)" stroke-width="2">
                    <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                    <polyline points="13 2 13 9 20 9"></polyline>
                </svg>`
            };
            return icons[type] || icons.file;
        }

        // ========== NAVIGATION ==========
        function openFolder(folderId, folderName) {
            currentFolderId = folderId;
            folderHistory.push({ id: folderId, name: folderName });
            updateBreadcrumb();
            loadFiles(folderId);
        }

        function navigateToFolder(index) {
            folderHistory = folderHistory.slice(0, index + 1);
            currentFolderId = folderHistory[folderHistory.length - 1].id;
            updateBreadcrumb();
            loadFiles(currentFolderId);
        }

        function navigateToRoot() {
            navigateToFolder(0);
        }

        function updateBreadcrumb() {
            const breadcrumb = document.getElementById('breadcrumb');
            breadcrumb.innerHTML = folderHistory.map((folder, index) => {
                const isLast = index === folderHistory.length - 1;
                return `
                    <div class="breadcrumb-item">
                        ${isLast 
                            ? `<span class="breadcrumb-link" style="opacity: 0.5;">${escapeHtml(folder.name)}</span>`
                            : `<a href="#" class="breadcrumb-link" onclick="navigateToFolder(${index}); return false;">${escapeHtml(folder.name)}</a>`
                        }
                        ${!isLast ? '<span class="breadcrumb-separator">→</span>' : ''}
                    </div>
                `;
            }).join('');
        }

        // ========== MEDIA VIEWER ==========
        function viewFile(fileId, fileName, fileType, mimeType) {
            const modal = document.getElementById('mediaModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');

            modalTitle.textContent = fileName;

            // Generate proper streaming URL
            const streamUrl = `https://drive.google.com/uc?export=view&id=${fileId}`;
            const downloadUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;

            let content = '';

            switch (fileType) {
                case 'image':
                    content = `
                        <div class="image-viewer">
                            <img src="${streamUrl}" alt="${escapeHtml(fileName)}">
                        </div>
                    `;
                    break;
                
                case 'video':
                    content = `
                        <video class="media-player" controls preload="metadata">
                            <source src="${streamUrl}" type="${mimeType}">
                            Your browser doesn't support video playback.
                            <a href="${downloadUrl}" style="color: var(--cyan);">Download video instead</a>
                        </video>
                    `;
                    break;
                
                case 'audio':
                    content = `
                        <audio class="media-player" controls preload="metadata" style="width: 100%;">
                            <source src="${streamUrl}" type="${mimeType}">
                            Your browser doesn't support audio playback.
                            <a href="${downloadUrl}" style="color: var(--cyan);">Download audio instead</a>
                        </audio>
                    `;
                    break;
                
                case 'document':
                    if (mimeType === 'application/pdf') {
                        content = `
                            <iframe 
                                src="https://docs.google.com/viewer?url=${encodeURIComponent(downloadUrl)}&embedded=true" 
                                style="width: 100%; height: 70vh; border: none;">
                            </iframe>
                        `;
                    } else {
                        content = `
                            <iframe 
                                src="https://docs.google.com/viewer?url=${encodeURIComponent(downloadUrl)}&embedded=true" 
                                style="width: 100%; height: 70vh; border: none;">
                            </iframe>
                        `;
                    }
                    break;
                
                default:
                    content = `
                        <div style="padding: 2rem; text-align: center;">
                            <p style="margin-bottom: 1rem;">Preview not available for this file type.</p>
                            <a href="${downloadUrl}" class="action-btn" style="display: inline-flex;">Download File</a>
                        </div>
                    `;
            }

            modalBody.innerHTML = content;
            modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('mediaModal');
            const modalBody = document.getElementById('modalBody');
            modal.classList.remove('active');
            
            // Stop any playing media
            const video = modalBody.querySelector('video');
            const audio = modalBody.querySelector('audio');
            if (video) video.pause();
            if (audio) audio.pause();
            
            modalBody.innerHTML = '';
        }

        // Close modal on background click
        document.getElementById('mediaModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Close modal on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // ========== VIEW MODE ==========
        function setViewMode(mode) {
            currentViewMode = mode;
            
            document.getElementById('gridBtn').classList.toggle('active', mode === 'grid');
            document.getElementById('listBtn').classList.toggle('active', mode === 'list');
            
            renderFiles();
        }

        // ========== PAGINATION ==========
        function renderPagination() {
            const totalPages = Math.ceil(filteredFiles.length / CONFIG.pageSize);
            const container = document.getElementById('pagination');

            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '';

            // Previous button
            html += `
                <button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                    ←
                </button>
            `;

            // Page numbers
            const maxButtons = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxButtons / 2));
            let endPage = Math.min(totalPages, startPage + maxButtons - 1);

            if (endPage - startPage < maxButtons - 1) {
                startPage = Math.max(1, endPage - maxButtons + 1);
            }

            if (startPage > 1) {
                html += `<button class="page-btn" onclick="changePage(1)">1</button>`;
                if (startPage > 2) html += '<span style="padding: 0 0.5rem;">...</span>';
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `
                    <button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">
                        ${i}
                    </button>
                `;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += '<span style="padding: 0 0.5rem;">...</span>';
                html += `<button class="page-btn" onclick="changePage(${totalPages})">${totalPages}</button>`;
            }

            // Next button
            html += `
                <button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                    →
                </button>
            `;

            container.innerHTML = html;
        }

        function changePage(page) {
            const totalPages = Math.ceil(filteredFiles.length / CONFIG.pageSize);
            if (page < 1 || page > totalPages) return;
            
            currentPage = page;
            renderFiles();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ========== UTILITIES ==========
        function formatFileSize(bytes) {
            if (!bytes) return 'N/A';
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return Math.round(bytes / Math.pow(1024, i) * 100) / 100 + ' ' + sizes[i];
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateResultsInfo() {
            const info = document.getElementById('resultsInfo');
            const total = filteredFiles.length;
            const showing = Math.min(CONFIG.pageSize, total - (currentPage - 1) * CONFIG.pageSize);
            
            if (total === 0) {
                info.textContent = 'No files found';
            } else if (total <= CONFIG.pageSize) {
                info.textContent = `${total} file${total !== 1 ? 's' : ''}`;
            } else {
                const start = (currentPage - 1) * CONFIG.pageSize + 1;
                const end = Math.min(currentPage * CONFIG.pageSize, total);
                info.textContent = `Showing ${start}-${end} of ${total} files`;
            }
        }

        function showLoading(show) {
            document.getElementById('loadingState').style.display = show ? 'flex' : 'none';
            document.getElementById('filesContent').style.display = show ? 'none' : 'block';
        }

        function showError(message) {
            alert(message);
        }

        // ========== START ==========
        init();
    </script>
</body>
</html>
