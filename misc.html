<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miscellaneous - The Drive</title>
    <link rel="stylesheet" href="dist/styles.css">
    <link rel="stylesheet" href="darkmode.css">
    <link rel="stylesheet" href="transitions.css">
    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .tile-small { width: 100%; }
        .tile-medium { width: 100%; }
        .tile-large { width: 100%; }
        @media (min-width: 640px) {
            .tile-small.cols-2 { width: calc(50% - 0.75rem); }
            .tile-small.cols-3 { width: calc(33.333% - 1rem); }
            .tile-small.cols-4 { width: calc(25% - 1.125rem); }
            .tile-small.cols-5 { width: calc(20% - 1.2rem); }
            .tile-small.cols-6 { width: calc(16.666% - 1.25rem); }

            .tile-medium.cols-2 { width: calc(50% - 0.75rem); }
            .tile-medium.cols-3 { width: calc(33.333% - 1rem); }
            .tile-medium.cols-4 { width: calc(25% - 1.125rem); }

            .tile-large.cols-2 { width: calc(50% - 0.75rem); }
            .tile-large.cols-3 { width: calc(33.333% - 1rem); }
        }
        /* Hide dark mode toggle when modal is open */
        body:has(#mediaModal:not(.hidden)) .dark-mode-toggle {
            display: none;
        }
        /* Subtle background image with overlay */
        body {
            position: relative;
            background: var(--bg-primary);
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('/images/front.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            opacity: 0.08;
            z-index: -1;
        }
        .dark body::before {
            opacity: 0.05;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Dark Mode Toggle -->
    <button class="dark-mode-toggle" onclick="toggleDarkMode()" aria-label="Toggle dark mode">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
    </button>

    <!-- Media Viewer Modal -->
    <div id="mediaModal" class="hidden fixed inset-0 bg-black bg-opacity-90 z-50 flex items-center justify-center p-4">
        <button onclick="closeMediaViewer()" class="absolute top-4 right-4 text-white hover:text-gray-300 z-10">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
        <div id="mediaContent" class="max-w-7xl max-h-full w-full h-full flex items-center justify-center"></div>
    </div>

    <!-- Download Toast Notification -->
    <div id="downloadToast" class="hidden fixed bottom-4 right-4 bg-white rounded-lg shadow-2xl p-4 z-50 max-w-sm">
        <div class="flex items-center gap-3">
            <svg class="w-6 h-6 text-purple-600 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <div class="flex-1">
                <p class="font-medium text-gray-900">Preparing download...</p>
                <p class="text-sm text-gray-500" id="downloadFileName"></p>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <!-- Header with Back Button -->
        <div class="mb-8">
            <a href="index.html" class="inline-flex items-center text-purple-600 hover:text-purple-700 dark:text-pink-400 dark:hover:text-cyan-400 mb-4 transition-colors">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Collections
            </a>

            <!-- Navigation -->
            <nav class="flex gap-6 justify-center mb-4">
                <a href="index.html" class="text-purple-600 dark:text-pink-400 hover:text-purple-700 dark:hover:text-pink-300 transition-colors font-medium">Home</a>
                <a href="search.html" class="text-purple-600 dark:text-pink-400 hover:text-purple-700 dark:hover:text-pink-300 transition-colors font-bold flex items-center gap-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    Search
                </a>
                <a href="about.html" class="text-purple-600 dark:text-pink-400 hover:text-purple-700 dark:hover:text-pink-300 transition-colors font-medium">About</a>
            </nav>

            <div class="text-center">
                <h1 class="text-5xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 dark:from-pink-400 dark:to-cyan-400 bg-clip-text text-transparent mb-2">
                    Miscellaneous
                </h1>
                <p style="color: var(--text-secondary);">Artwork, documents, ephemera, fan creations, and archival materials</p>
            </div>
        </div>

        <!-- Breadcrumb Navigation -->
        <div id="breadcrumbContainer" class="hidden mb-4"></div>

        <!-- Controls -->
        <div class="rounded-2xl shadow-lg p-6 mb-8" style="background: var(--card-bg);">
            <!-- Hidden inputs to keep JS functional -->
            <input type="text" id="searchInput" class="hidden" />
            <select id="tileSize" class="hidden" onchange="changeTileSize()">
                <option value="small">Small</option>
                <option value="medium" selected>Medium</option>
                <option value="large">Large</option>
            </select>
            <select id="columnCount" class="hidden" onchange="changeColumns()">
                <option value="2">2</option>
                <option value="3" selected>3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
            </select>

            <div class="flex items-center justify-between mb-4">
                <div class="text-sm" id="resultsCount" style="color: var(--text-secondary);">
                    Loading...
                </div>
                <div class="flex gap-2">
                    <button onclick="setViewMode('grid')" id="gridBtn" class="p-2.5 rounded-lg transition-all hover:scale-105" style="background: var(--accent-gradient); color: white;">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                        </svg>
                    </button>
                    <button onclick="setViewMode('list')" id="listBtn" class="p-2.5 rounded-lg transition-all hover:scale-105" style="background: var(--secondary-bg); color: var(--text-secondary);">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="flex flex-wrap gap-2">
                <button onclick="filterByCategory('all')" id="categoryAllBtn" class="px-4 py-2 rounded-lg font-medium transition-all bg-gradient-to-r from-purple-600 to-pink-600 text-white shadow-md">
                    All
                </button>
                <button onclick="filterByCategory('3d-models')" id="category3dModelsBtn" class="px-4 py-2 rounded-lg font-medium transition-all bg-gray-100 text-gray-700 hover:bg-gray-200">
                    3D Models
                </button>
                <button onclick="filterByCategory('fonts')" id="categoryFontsBtn" class="px-4 py-2 rounded-lg font-medium transition-all bg-gray-100 text-gray-700 hover:bg-gray-200">
                    Fonts
                </button>
                <button onclick="filterByCategory('documents')" id="categoryDocumentsBtn" class="px-4 py-2 rounded-lg font-medium transition-all bg-gray-100 text-gray-700 hover:bg-gray-200">
                    Documents
                </button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="flex items-center justify-center py-20">
            <svg class="w-8 h-8 text-purple-600 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </div>

        <!-- Files Container -->
        <div id="filesContainer" class="hidden"></div>

        <!-- Pagination -->
        <div id="paginationContainer" class="hidden"></div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20">
            <p class="text-gray-500 text-lg">No files found</p>
        </div>
    </div>

    <script src="https://apis.google.com/js/api.js"></script>
    <script>
        // ========== CONFIGURATION ==========
        const CONFIG = {
            apiKey: 'AIzaSyA8lfUHsneUaeCaZnqA97nfxuE1KmdDbFY',
            folders: [
                { id: '1bcWBsGris6-QDetXZapgegUVq8qBkaAo', name: '3D Models', category: '3d-models' },
                { id: '1EWwmWv8jmYJ1JVpZ_H6t-pBvF6r3vP09', name: 'Fonts', category: 'fonts' },
                { id: '1-0ptGg8x459LOG6vA68aPCoNMaIe77ZT', name: 'Documents', category: 'documents' }
            ],
            collectionName: 'Miscellaneous',
            gradientFrom: 'yellow-600',
            gradientTo: 'orange-600'
        };

        // ========== STATE ==========
        let allFiles = [];
        let filteredFiles = [];
        let currentPage = 1;
        const itemsPerPage = 24;
        let currentViewMode = 'grid';
        let currentFilter = 'all';
        let currentCategoryFilter = 'all';
        let currentTileSize = 'medium';
        let currentColumns = 3;
        let folderStack = []; // Track navigation history
        let currentFolderId = null; // Current folder being viewed
        let currentFolderName = null; // Current folder name

        // ========== INITIALIZATION ==========
        function init() {
            gapi.load('client', initClient);
            document.getElementById('searchInput').addEventListener('input', handleSearch);
        }

        function initClient() {
            gapi.client.init({
                apiKey: CONFIG.apiKey,
                discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
            }).then(() => {
                loadAllFolders();
            }).catch((error) => {
                console.error('Error initializing Google API:', error);
                document.getElementById('loadingState').innerHTML = '<p class="text-red-600">Error loading files. Please check your API configuration.</p>';
            });
        }

        async function loadAllFolders() {
            // Reset navigation state
            folderStack = [];
            currentFolderId = null;
            currentFolderName = null;

            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('filesContainer').classList.add('hidden');

            try {
                let allLoadedFiles = [];

                // Load files from each folder
                for (const folder of CONFIG.folders) {
                    const files = await loadFilesFromFolder(folder.id, folder.category);
                    allLoadedFiles = allLoadedFiles.concat(files);
                }

                allFiles = allLoadedFiles.map(file => ({
                    ...file,
                    type: getFileType(file.mimeType)
                }));

                // Sort by category first, then by type (folders first), then by name
                allFiles.sort((a, b) => {
                    if (a.category !== b.category) {
                        return a.category.localeCompare(b.category);
                    }
                    if (a.type === 'folder' && b.type !== 'folder') return -1;
                    if (a.type !== 'folder' && b.type === 'folder') return 1;
                    return a.name.localeCompare(b.name);
                });

                filteredFiles = [...allFiles];
                currentPage = 1;
                document.getElementById('loadingState').classList.add('hidden');
                renderBreadcrumb();
                renderFiles();
            } catch (error) {
                console.error('Error loading files:', error);
                document.getElementById('loadingState').innerHTML = '<p class="text-red-600">Error loading files.</p>';
            }
        }

        async function loadFilesFromFolder(folderId, category) {
            let allLoadedFiles = [];
            let pageToken = null;

            do {
                const response = await gapi.client.drive.files.list({
                    q: `'${folderId}' in parents and trashed=false`,
                    fields: 'nextPageToken, files(id, name, mimeType, thumbnailLink, webViewLink, webContentLink, size, modifiedTime, iconLink)',
                    pageSize: 1000,
                    orderBy: 'folder,name',
                    pageToken: pageToken,
                });

                const filesWithCategory = response.result.files.map(file => ({
                    ...file,
                    category: category
                }));

                allLoadedFiles = allLoadedFiles.concat(filesWithCategory);
                pageToken = response.result.nextPageToken;
            } while (pageToken);

            return allLoadedFiles;
        }

        // ========== FOLDER NAVIGATION ==========
        async function navigateToFolder(folderId, folderName, category) {
            // Save current location to stack
            folderStack.push({
                folderId: currentFolderId,
                folderName: currentFolderName,
                files: [...allFiles],
                filteredFiles: [...filteredFiles],
                category: currentCategoryFilter
            });

            currentFolderId = folderId;
            currentFolderName = folderName;

            // Load files from this folder
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('filesContainer').classList.add('hidden');

            try {
                const files = await loadFilesFromFolder(folderId, category);
                allFiles = files.map(file => ({
                    ...file,
                    type: getFileType(file.mimeType)
                }));

                // Sort by type (folders first), then by name
                allFiles.sort((a, b) => {
                    if (a.type === 'folder' && b.type !== 'folder') return -1;
                    if (a.type !== 'folder' && b.type === 'folder') return 1;
                    return a.name.localeCompare(b.name);
                });

                filteredFiles = [...allFiles];
                currentPage = 1;
                document.getElementById('loadingState').classList.add('hidden');
                renderBreadcrumb();
                renderFiles();
            } catch (error) {
                console.error('Error loading folder:', error);
                document.getElementById('loadingState').innerHTML = '<p class="text-red-600">Error loading folder.</p>';
            }
        }

        function navigateBack() {
            if (folderStack.length === 0) {
                // Return to root
                loadAllFolders();
                return;
            }

            const previous = folderStack.pop();
            currentFolderId = previous.folderId;
            currentFolderName = previous.folderName;
            allFiles = previous.files;
            filteredFiles = previous.filteredFiles;
            currentCategoryFilter = previous.category;

            // Update category button styles
            filterByCategory(currentCategoryFilter);

            currentPage = 1;
            renderBreadcrumb();
            renderFiles();
        }

        function renderBreadcrumb() {
            const breadcrumbContainer = document.getElementById('breadcrumbContainer');
            if (!breadcrumbContainer) return;

            if (!currentFolderId) {
                breadcrumbContainer.classList.add('hidden');
                return;
            }

            breadcrumbContainer.classList.remove('hidden');

            let html = `
                <div class="flex items-center gap-2 text-sm" style="color: var(--text-secondary);">
                    <button onclick="navigateBack()" class="flex items-center gap-1 hover:text-purple-600 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                        </svg>
                        Back
                    </button>
                    <span class="font-medium">${currentFolderName}</span>
                </div>
            `;

            breadcrumbContainer.innerHTML = html;
        }

        // ========== CATEGORY FILTERING ==========
        function filterByCategory(category) {
            currentCategoryFilter = category;
            currentPage = 1;

            // Update button styles
            const buttons = {
                'all': 'categoryAllBtn',
                '3d-models': 'category3dModelsBtn',
                'fonts': 'categoryFontsBtn',
                'documents': 'categoryDocumentsBtn'
            };

            Object.entries(buttons).forEach(([cat, btnId]) => {
                const btn = document.getElementById(btnId);
                if (cat === category) {
                    btn.className = 'px-4 py-2 rounded-lg font-medium transition-all bg-gradient-to-r from-purple-600 to-pink-600 text-white shadow-md';
                } else {
                    btn.className = 'px-4 py-2 rounded-lg font-medium transition-all bg-gray-100 text-gray-700 hover:bg-gray-200';
                }
            });

            applyFilters();
        }

        function getCategoryDisplayName(category) {
            const names = {
                '3d-models': '3D Models',
                'fonts': 'Fonts',
                'documents': 'Documents'
            };
            return names[category] || category;
        }

        function getCategoryColor(category) {
            const colors = {
                '3d-models': 'from-blue-500 to-cyan-500',
                'fonts': 'from-purple-500 to-pink-500',
                'documents': 'from-green-500 to-teal-500'
            };
            return colors[category] || 'from-gray-500 to-gray-600';
        }

        // ========== VIEW CONTROLS ==========
        function changeTileSize() {
            currentTileSize = document.getElementById('tileSize').value;
            if (currentViewMode === 'grid') {
                renderFiles();
            }
        }

        function changeColumns() {
            currentColumns = parseInt(document.getElementById('columnCount').value);
            if (currentViewMode === 'grid') {
                renderFiles();
            }
        }

        // ========== DOWNLOAD HANDLER ==========
        function handleDownload(url, fileName) {
            const toast = document.getElementById('downloadToast');
            const fileNameEl = document.getElementById('downloadFileName');

            fileNameEl.textContent = fileName;
            toast.classList.remove('hidden');

            // Create hidden link and trigger download
            const link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // Hide toast after 3 seconds
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        // ========== MEDIA VIEWER ==========
        function openMediaViewer(file) {
            const modal = document.getElementById('mediaModal');
            const content = document.getElementById('mediaContent');

            content.innerHTML = '';

            if (file.type === 'image') {
                content.innerHTML = `
                    <div class="w-full h-full flex flex-col items-center justify-center" style="min-height: 70vh;">
                        <iframe
                            src="https://drive.google.com/file/d/${file.id}/preview"
                            class="w-full h-full"
                            style="min-height: 70vh;"
                            allow="autoplay"
                            frameborder="0">
                        </iframe>
                        <div class="mt-4 flex gap-3">
                            <a href="${file.webViewLink}" target="_blank" rel="noopener noreferrer"
                               class="inline-flex items-center gap-2 px-4 py-2 bg-white/10 hover:bg-white/20 text-white rounded-lg transition-colors text-sm">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                                </svg>
                                Open in Google Drive
                            </a>
                            ${file.webContentLink ? `
                                <button onclick='handleDownload("${file.webContentLink}", "${file.name.replace(/'/g, "\\'")}")'
                                   class="inline-flex items-center gap-2 px-4 py-2 bg-white/10 hover:bg-white/20 text-white rounded-lg transition-colors text-sm">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                                    </svg>
                                    Download
                                </button>
                            ` : ''}
                        </div>
                        <p class="text-white/70 text-xs mt-3">
                            Note: If image doesn't display, you may need to click Open in Google Drive.
                        </p>
                    </div>
                `;
            } else if (file.type === 'video') {
                content.innerHTML = `
                    <div class="w-full h-full flex flex-col items-center justify-center" style="min-height: 70vh;">
                        <iframe
                            src="https://drive.google.com/file/d/${file.id}/preview"
                            class="w-full h-full"
                            style="min-height: 70vh;"
                            allow="autoplay"
                            frameborder="0">
                        </iframe>
                        <div class="mt-4 flex gap-3">
                            <a href="${file.webViewLink}" target="_blank" rel="noopener noreferrer"
                               class="inline-flex items-center gap-2 px-4 py-2 bg-white/10 hover:bg-white/20 text-white rounded-lg transition-colors text-sm">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                                </svg>
                                Open in Google Drive
                            </a>
                            ${file.webContentLink ? `
                                <button onclick='handleDownload("${file.webContentLink}", "${file.name.replace(/'/g, "\\'")}")'
                                   class="inline-flex items-center gap-2 px-4 py-2 bg-white/10 hover:bg-white/20 text-white rounded-lg transition-colors text-sm">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                                    </svg>
                                    Download
                                </button>
                            ` : ''}
                        </div>
                        <p class="text-white/70 text-xs mt-3">
                            Note: If video doesn't play, you may need to click Open in Google Drive.
                        </p>
                    </div>
                `;
            } else if (file.type === 'audio') {
                // Audio files - use Google Drive iframe preview with smaller size
                content.innerHTML = `
                    <div class="w-full flex flex-col items-center justify-center">
                        <iframe
                            src="https://drive.google.com/file/d/${file.id}/preview"
                            class="w-full"
                            style="min-height: 100px; max-height: 150px; height: 150px;"
                            allow="autoplay"
                            frameborder="0">
                        </iframe>
                        <div class="mt-4 flex gap-3">
                            <a href="${file.webViewLink}" target="_blank" rel="noopener noreferrer"
                               class="inline-flex items-center gap-2 px-4 py-2 bg-white/10 hover:bg-white/20 text-white rounded-lg transition-colors text-sm">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                                </svg>
                                Open in Google Drive
                            </a>
                            ${file.webContentLink ? `
                                <button onclick='handleDownload("${file.webContentLink}", "${file.name.replace(/'/g, "\\'")}")'
                                   class="inline-flex items-center gap-2 px-4 py-2 bg-white/10 hover:bg-white/20 text-white rounded-lg transition-colors text-sm">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                                    </svg>
                                    Download
                                </button>
                            ` : ''}
                        </div>
                        <p class="text-white/70 text-xs mt-3">
                            Note: If audio doesn't play, you may need to click Open in Google Drive.
                        </p>
                    </div>
                `;
            } else if (file.type === 'document') {
                // Document files - use Google Drive iframe preview
                content.innerHTML = `
                    <div class="w-full h-full flex flex-col items-center justify-center" style="min-height: 70vh;">
                        <iframe
                            src="https://drive.google.com/file/d/${file.id}/preview"
                            class="w-full h-full"
                            style="min-height: 70vh;"
                            allow="autoplay"
                            frameborder="0">
                        </iframe>
                        <div class="mt-4 flex gap-3">
                            <a href="${file.webViewLink}" target="_blank" rel="noopener noreferrer"
                               class="inline-flex items-center gap-2 px-4 py-2 bg-white/10 hover:bg-white/20 text-white rounded-lg transition-colors text-sm">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                                </svg>
                                Open in Google Drive
                            </a>
                            ${file.webContentLink ? `
                                <button onclick='handleDownload("${file.webContentLink}", "${file.name.replace(/'/g, "\\'")}")'
                                   class="inline-flex items-center gap-2 px-4 py-2 bg-white/10 hover:bg-white/20 text-white rounded-lg transition-colors text-sm">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                                    </svg>
                                    Download
                                </button>
                            ` : ''}
                        </div>
                        <p class="text-white/70 text-xs mt-3">
                            Note: If document doesn't display, you may need to click Open in Google Drive.
                        </p>
                    </div>
                `;
            } else {
                content.innerHTML = `
                    <div class="bg-white rounded-lg p-8 max-w-2xl w-full text-center">
                        <p class="text-gray-600 mb-4">Preview not available for this file type.</p>
                        <a href="${file.webViewLink}" target="_blank" class="inline-flex items-center gap-2 px-6 py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors">
                            Open in Google Drive
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                            </svg>
                        </a>
                    </div>
                `;
            }

            modal.classList.remove('hidden');
        }

        function closeMediaViewer() {
            const modal = document.getElementById('mediaModal');
            const content = document.getElementById('mediaContent');
            modal.classList.add('hidden');
            content.innerHTML = '';
        }

        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeMediaViewer();
            }
        });

        // ========== FILE TYPE DETECTION ==========
        function getFileType(mimeType) {
            if (mimeType === 'application/vnd.google-apps.folder') return 'folder';
            if (mimeType.startsWith('image/')) return 'image';
            if (mimeType.startsWith('video/')) return 'video';
            if (mimeType.startsWith('audio/')) return 'audio';
            return 'document';
        }

        function getFileIcon(type) {
            const icons = {
                folder: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>',
                image: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>',
                video: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>',
                audio: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path>',
                document: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>'
            };
            return icons[type] || icons.document;
        }

        // ========== FILTERING ==========
        function filterByType(type) {
            currentFilter = type;
            currentPage = 1;

            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.type === type) {
                    btn.className = 'filter-btn px-4 py-2 rounded-lg font-medium transition-all bg-gradient-to-r from-yellow-600 to-orange-600 text-white shadow-md';
                } else {
                    btn.className = 'filter-btn px-4 py-2 rounded-lg font-medium transition-all bg-gray-100 text-gray-700 hover:bg-gray-200';
                }
            });

            applyFilters();
        }

        function handleSearch(e) {
            currentPage = 1;
            applyFilters();
        }

        function applyFilters() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();

            filteredFiles = allFiles.filter(file => {
                const matchesSearch = file.name.toLowerCase().includes(searchQuery);
                const matchesType = currentFilter === 'all' || file.type === currentFilter;
                const matchesCategory = currentCategoryFilter === 'all' || file.category === currentCategoryFilter;
                return matchesSearch && matchesType && matchesCategory;
            });

            renderFiles();
        }

        // ========== VIEW MODE ==========
        function setViewMode(mode) {
            currentViewMode = mode;

            const gridBtn = document.getElementById('gridBtn');
            const listBtn = document.getElementById('listBtn');

            if (mode === 'grid') {
                gridBtn.className = 'p-2.5 rounded-lg transition-all hover:scale-105';
                gridBtn.style = 'background: var(--accent-gradient); color: white;';
                listBtn.className = 'p-2.5 rounded-lg transition-all hover:scale-105';
                listBtn.style = 'background: var(--secondary-bg); color: var(--text-secondary);';
            } else {
                listBtn.className = 'p-2.5 rounded-lg transition-all hover:scale-105';
                listBtn.style = 'background: var(--accent-gradient); color: white;';
                gridBtn.className = 'p-2.5 rounded-lg transition-all hover:scale-105';
                gridBtn.style = 'background: var(--secondary-bg); color: var(--text-secondary);';
            }

            renderFiles();
        }

        // ========== RENDERING ==========
        function renderFiles() {
            const container = document.getElementById('filesContainer');
            const emptyState = document.getElementById('emptyState');

            if (filteredFiles.length === 0) {
                container.classList.add('hidden');
                emptyState.classList.remove('hidden');
                document.getElementById('resultsCount').textContent = 'No files found';
                document.getElementById('paginationContainer').classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            container.classList.remove('hidden');

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageFiles = filteredFiles.slice(startIndex, endIndex);

            document.getElementById('resultsCount').textContent =
                `Showing ${startIndex + 1}-${Math.min(endIndex, filteredFiles.length)} of ${filteredFiles.length} items`;

            if (currentViewMode === 'grid') {
                container.className = 'flex flex-wrap gap-6';
                container.innerHTML = pageFiles.map(file => renderGridCard(file)).join('');
            } else {
                container.className = 'flex flex-col gap-4';
                container.innerHTML = pageFiles.map(file => renderListItem(file)).join('');
            }

            renderPagination();
        }

        function renderGridCard(file) {
            const heightClass = currentTileSize === 'small' ? 'h-32' : currentTileSize === 'large' ? 'h-80' : 'h-48';
            const categoryGradient = getCategoryColor(file.category);

            if (file.type === 'folder') {
                return `
                    <button onclick='navigateToFolder("${file.id}", "${file.name.replace(/'/g, "\\'")}", "${file.category}")' class="tile-${currentTileSize} cols-${currentColumns} bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300 text-left relative cursor-pointer w-full">
                        <div class="${heightClass} bg-gradient-to-br from-gray-100 to-blue-100 flex items-center justify-center relative overflow-hidden">
                            <svg class="${currentTileSize === 'small' ? 'w-12 h-12' : currentTileSize === 'large' ? 'w-28 h-28' : 'w-20 h-20'} text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">${getFileIcon('folder')}</svg>
                        </div>
                        <div class="p-4">
                            <h3 class="font-medium text-gray-900 truncate mb-1" title="${file.name}">${file.name}</h3>
                            <div class="text-sm text-gray-500">Folder</div>
                        </div>
                    </button>
                `;
            }

            const canPreview = ['image', 'video', 'audio', 'document'].includes(file.type);

            return `
                <div class="tile-${currentTileSize} cols-${currentColumns} bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300">
                    <button ${canPreview ? `onclick='openMediaViewer(${JSON.stringify(file)})' ` : ''}
                            class="${heightClass} bg-gradient-to-br from-gray-100 to-blue-100 flex items-center justify-center relative overflow-hidden w-full ${canPreview ? 'cursor-pointer' : ''}">
                        ${file.thumbnailLink
                            ? `<img src="${file.thumbnailLink}" alt="${file.name}" class="w-full h-full object-cover">`
                            : `<svg class="${currentTileSize === 'small' ? 'w-10 h-10' : currentTileSize === 'large' ? 'w-24 h-24' : 'w-16 h-16'} text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">${getFileIcon(file.type)}</svg>`
                        }
                        <div class="absolute top-2 right-2 bg-white/90 rounded-full p-1.5">
                            <svg class="w-4 h-4 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">${getFileIcon(file.type)}</svg>
                        </div>
                        ${canPreview ? `
                            <div class="absolute inset-0 bg-black bg-opacity-0 hover:bg-opacity-30 transition-all flex items-center justify-center">
                                <svg class="w-12 h-12 text-white opacity-0 hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                            </div>
                        ` : ''}
                    </button>
                    <div class="p-4">
                        <h3 class="font-medium text-gray-900 truncate mb-2" title="${file.name}">${file.name}</h3>
                        <div class="flex items-center justify-between text-sm text-gray-500">
                            <span>${formatFileSize(file.size)}</span>
                            <div class="flex gap-2">
                                ${canPreview ? `
                                    <button onclick='openMediaViewer(${JSON.stringify(file)})'
                                       class="p-1.5 hover:bg-purple-100 rounded-full transition-colors" title="Preview">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                        </svg>
                                    </button>
                                ` : ''}
                                ${file.webViewLink ? `
                                    <a href="${file.webViewLink}" target="_blank" rel="noopener noreferrer"
                                       class="p-1.5 hover:bg-purple-100 rounded-full transition-colors" title="View in Drive">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                                        </svg>
                                    </a>
                                ` : ''}
                                ${file.webContentLink ? `
                                    <button onclick='handleDownload("${file.webContentLink}", "${file.name.replace(/'/g, "\\'")}")'
                                       class="p-1.5 hover:bg-purple-100 rounded-full transition-colors" title="Download">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                                        </svg>
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderListItem(file) {
            const categoryGradient = getCategoryColor(file.category);

            if (file.type === 'folder') {
                return `
                    <button onclick='navigateToFolder("${file.id}", "${file.name.replace(/'/g, "\\'")}", "${file.category}")' class="bg-white rounded-lg shadow-sm p-4 hover:shadow-md transition-shadow duration-300 flex items-center gap-4 w-full text-left cursor-pointer">
                        <div class="w-12 h-12 bg-gradient-to-br from-gray-100 to-blue-100 rounded-lg flex items-center justify-center flex-shrink-0">
                            <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">${getFileIcon('folder')}</svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="font-medium text-gray-900 truncate" title="${file.name}">${file.name}</h3>
                            <p class="text-sm text-gray-500">Folder</p>
                        </div>
                    </button>
                `;
            }

            const canPreview = ['image', 'video', 'audio', 'document'].includes(file.type);

            return `
                <div class="bg-white rounded-lg shadow-sm p-4 hover:shadow-md transition-shadow duration-300 flex items-center gap-4">
                    <button ${canPreview ? `onclick='openMediaViewer(${JSON.stringify(file)})' ` : ''}
                            class="w-12 h-12 bg-gradient-to-br from-gray-100 to-blue-100 rounded-lg flex items-center justify-center flex-shrink-0 ${canPreview ? 'cursor-pointer hover:scale-105 transition-transform' : ''}">
                        ${file.thumbnailLink
                            ? `<img src="${file.thumbnailLink}" alt="${file.name}" class="w-full h-full object-cover rounded-lg">`
                            : `<svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">${getFileIcon(file.type)}</svg>`
                        }
                    </button>
                    <div class="flex-1 min-w-0">
                        <h3 class="font-medium text-gray-900 truncate" title="${file.name}">${file.name}</h3>
                        <p class="text-sm text-gray-500">${formatFileSize(file.size)}</p>
                    </div>
                    <div class="flex gap-2 flex-shrink-0">
                        ${canPreview ? `
                            <button onclick='openMediaViewer(${JSON.stringify(file)})'
                               class="p-2 hover:bg-purple-100 rounded-full transition-colors" title="Preview">
                                <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                            </button>
                        ` : ''}
                        ${file.webViewLink ? `
                            <a href="${file.webViewLink}" target="_blank" rel="noopener noreferrer"
                               class="p-2 hover:bg-purple-100 rounded-full transition-colors" title="View in Drive">
                                <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                                </svg>
                            </a>
                        ` : ''}
                        ${file.webContentLink ? `
                            <button onclick='handleDownload("${file.webContentLink}", "${file.name.replace(/'/g, "\\'")}")'
                               class="p-2 hover:bg-purple-100 rounded-full transition-colors" title="Download">
                                <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                                </svg>
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // ========== PAGINATION ==========
        function renderPagination() {
            const totalPages = Math.ceil(filteredFiles.length / itemsPerPage);
            const container = document.getElementById('paginationContainer');

            if (totalPages <= 1) {
                container.classList.add('hidden');
                return;
            }

            container.classList.remove('hidden');

            const maxButtons = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxButtons / 2));
            let endPage = Math.min(totalPages, startPage + maxButtons - 1);

            if (endPage - startPage < maxButtons - 1) {
                startPage = Math.max(1, endPage - maxButtons + 1);
            }

            let html = '<div class="flex items-center justify-center gap-2 mt-8">';

            html += `
                <button onclick="changePage(${currentPage - 1})"
                        ${currentPage === 1 ? 'disabled' : ''}
                        class="p-2 rounded-lg transition-colors ${currentPage === 1
                            ? 'bg-gray-100 text-gray-400 cursor-not-allowed'
                            : 'bg-white text-gray-700 hover:bg-purple-100 shadow-sm'}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>
            `;

            if (startPage > 1) {
                html += `<button onclick="changePage(1)" class="px-4 py-2 rounded-lg bg-white text-gray-700 hover:bg-purple-100 shadow-sm transition-colors">1</button>`;
                if (startPage > 2) html += '<span class="text-gray-400">...</span>';
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `
                    <button onclick="changePage(${i})"
                            class="px-4 py-2 rounded-lg transition-colors ${i === currentPage
                                ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white shadow-md'
                                : 'bg-white text-gray-700 hover:bg-purple-100 shadow-sm'}">
                        ${i}
                    </button>
                `;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += '<span class="text-gray-400">...</span>';
                html += `<button onclick="changePage(${totalPages})" class="px-4 py-2 rounded-lg bg-white text-gray-700 hover:bg-purple-100 shadow-sm transition-colors">${totalPages}</button>`;
            }

            html += `
                <button onclick="changePage(${currentPage + 1})"
                        ${currentPage === totalPages ? 'disabled' : ''}
                        class="p-2 rounded-lg transition-colors ${currentPage === totalPages
                            ? 'bg-gray-100 text-gray-400 cursor-not-allowed'
                            : 'bg-white text-gray-700 hover:bg-purple-100 shadow-sm'}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
            `;

            html += '</div>';
            container.innerHTML = html;
        }

        function changePage(page) {
            currentPage = page;
            renderFiles();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ========== UTILITIES ==========
        function formatFileSize(bytes) {
            if (!bytes) return 'N/A';
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return Math.round(bytes / Math.pow(1024, i) * 100) / 100 + ' ' + sizes[i];
        }

        // ========== START ==========
        init();
    </script>
    <script src="darkmode.js"></script>
</body>
</html>
